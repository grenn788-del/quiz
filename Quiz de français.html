<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz de français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: une colonne plein écran pour iPhone, barre d'action fixe en bas, grandes zones tactiles. */
:root{
  --bg:#edf0f6; --card:#ffffff; --ink:#141a2b; --muted:#5d6580; --line:#d9deea;
  --accent:#2f4bd8; --accent-ink:#ffffff; --ok:#0f7a58; --ko:#c0332b;
  --ok-bg:#dff3ea; --ko-bg:#fbe3e0; --chip:#e1e6f2;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --card:#171c2e; --ink:#e8ebf6; --muted:#9aa2bd; --line:#2a3148;
    --accent:#8ea3ff; --accent-ink:#0e1220; --ok:#4cc8a0; --ko:#ff8a7c;
    --ok-bg:#12372d; --ko-bg:#4a211d; --chip:#222a42; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --card:#171c2e; --ink:#e8ebf6; --muted:#9aa2bd; --line:#2a3148;
  --accent:#8ea3ff; --accent-ink:#0e1220; --ok:#4cc8a0; --ko:#ff8a7c;
  --ok-bg:#12372d; --ko-bg:#4a211d; --chip:#222a42; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 130px;
}
.app{max-width:560px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:6px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 8px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* puces de filtre */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;background:var(--chip);font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.count{margin:22px 0 0;color:var(--muted)}
.best{margin-top:10px;font-size:.9rem;color:var(--muted)}

/* question */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pos{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.quit{min-height:44px;min-width:44px;font-size:1.4rem;color:var(--muted)}
.tags{display:flex;gap:6px;margin-bottom:12px}
.tag{padding:3px 10px;border-radius:99px;background:var(--chip);font-size:.78rem;font-weight:600;letter-spacing:.02em}
.ctx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:1rem;white-space:pre-wrap}
.stem{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.25;margin:0 0 16px;text-wrap:balance}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:1rem}
.choice b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:.85rem}
.choice span{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.choice:active:not(:disabled){border-color:var(--accent)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ko{border-color:var(--ko);background:var(--ko-bg)}
.choice.ok b{background:var(--ok);color:var(--card)}
.choice.ko b{background:var(--ko);color:var(--card)}
.choice:disabled{cursor:default}
.expl{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.expl strong{display:block;margin-bottom:2px}
.expl .ok{color:var(--ok)} .expl .ko{color:var(--ko)}

/* résultat */
.score{font-family:var(--display);font-weight:800;font-size:4.5rem;line-height:1;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.rev{padding:0;margin:8px 0 0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rev li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rev small{display:block;color:var(--ok);margin-top:4px;font-weight:600}

/* barre d'action fixe */
.dock{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1.05rem}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<main class="app">

  <section id="start">
    <h1>Quiz de français</h1>
    <p class="sub">Entraîne-toi question par question. Choisis une compétence et un niveau.</p>
    <h2>Compétence</h2>
    <div class="chips" id="fSkill"></div>
    <h2>Niveau</h2>
    <div class="chips" id="fLevel"></div>
    <p class="count" id="count"></p>
    <p class="best" id="best"></p>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <button class="quit" id="quit" aria-label="Quitter le quiz">✕</button>
      <div class="bar"><i id="prog"></i></div>
      <span class="pos" id="pos"></span>
    </div>
    <div class="tags" id="tags"></div>
    <p class="ctx" id="ctx" hidden></p>
    <p class="stem" id="stem"></p>
    <div class="choices" id="choices"></div>
    <div class="expl" id="expl" hidden></div>
  </section>

  <section id="end" hidden>
    <h1 id="msg"></h1>
    <div class="score" id="score"></div>
    <p class="sub" id="pct"></p>
    <ul class="rev" id="review"></ul>
  </section>

</main>

<div class="dock"><div class="in" id="dock"></div></div>

<script>
const QUESTIONS = [
  {id:'ce-b2-001',skill:'CE',level:'B2',
   ctx:"Communiqué de la mairie : « En raison de travaux de voirie, la rue des Lilas sera fermée à la circulation du 3 au 14 novembre. Les riverains pourront néanmoins accéder à leur domicile par la rue Pasteur. »",
   stem:"Que doivent faire les habitants de la rue des Lilas ?",
   choices:["Quitter temporairement leur logement","Passer par la rue Pasteur pour rentrer chez eux","Stationner leur véhicule en dehors du quartier","Demander une autorisation à la mairie"],
   answer:1,expl:"Le texte précise que les riverains pourront accéder à leur domicile par la rue Pasteur : la rue est fermée à la circulation, mais l'accès reste possible."},
  {id:'ce-b2-002',skill:'CE',level:'B2',
   ctx:"Extrait d'un article : « Si le télétravail séduit une majorité de salariés, certains en soulignent les limites : isolement, frontière floue entre vie privée et vie professionnelle, difficulté à se déconnecter. »",
   stem:"Quelle est l'idée principale de ce passage ?",
   choices:["Le télétravail est rejeté par tous les salariés","Le télétravail plaît, mais présente aussi des inconvénients","Le télétravail améliore la vie privée","Le télétravail est interdit dans certaines entreprises"],
   answer:1,expl:"« Si… séduit une majorité… certains en soulignent les limites » oppose un avantage général à des inconvénients."},
  {id:'ce-b2-003',skill:'CE',level:'B2',
   ctx:"« Bien que le projet ait été retardé à plusieurs reprises, l'équipe est parvenue à le livrer dans les délais fixés par le client. »",
   stem:"Qu'exprime « bien que » dans cette phrase ?",
   choices:["Une cause","Une conséquence","Une concession","Une condition"],
   answer:2,expl:"« Bien que » (+ subjonctif) introduit une concession : malgré les retards, le résultat est atteint."},
  {id:'ce-b2-004',skill:'CE',level:'B2',
   ctx:"Annonce de la bibliothèque : « Les ouvrages empruntés doivent être rendus avant la fermeture du samedi. Passé ce délai, une pénalité de 0,50 € par jour et par livre sera appliquée. »",
   stem:"Que se passe-t-il si un lecteur rend ses livres en retard ?",
   choices:["Il perd son abonnement","Il paie une somme par jour et par livre","Il doit racheter les livres","Il reçoit un avertissement oral"],
   answer:1,expl:"Le texte annonce une pénalité de 0,50 € par jour et par livre après la date limite."},
  {id:'gr-b1-001',skill:'GR',level:'B1',ctx:"",
   stem:"Complétez : « Hier, nous ______ au cinéma. »",
   choices:["sommes allés","avons allé","allions","irons"],
   answer:0,expl:"« Aller » se conjugue avec l'auxiliaire être au passé composé : nous sommes allés."},
  {id:'gr-b1-002',skill:'GR',level:'B1',ctx:"",
   stem:"Complétez : « Il faut que tu ______ à l'heure. »",
   choices:["arrivais","arrives","arriveras","arriverais"],
   answer:1,expl:"« Il faut que » est suivi du subjonctif présent : que tu arrives."},
  {id:'gr-b2-001',skill:'GR',level:'B2',ctx:"",
   stem:"Complétez : « Si j'avais su, je ______ avant. »",
   choices:["viendrai","viens","serais venu","venais"],
   answer:2,expl:"Hypothèse irréalisable dans le passé : si + plus-que-parfait, conditionnel passé (je serais venu)."},
  {id:'vo-a2-001',skill:'VO',level:'A2',ctx:"",
   stem:"Quel mot est le contraire de « grand » ?",
   choices:["Large","Petit","Long","Haut"],
   answer:1,expl:"Le contraire de « grand » est « petit »."}
];
const SKILLS={CE:'Compréhension écrite',CO:'Compréhension orale',GR:'Grammaire',VO:'Vocabulaire',EE:'Expression écrite',EO:'Expression orale'};
const LEVELS=['A1','A2','B1','B2','C1','C2'];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selSkill='',selLevel='',pool=[],idx=0,answers=[],locked=false;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function screen(id){['start','quiz','end'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function dock(html){$('dock').innerHTML=html}

/* ----- accueil ----- */
function chips(el,items,cur,set){
  el.innerHTML='';
  items.forEach(([v,label])=>{
    const b=document.createElement('button');
    b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',String(v===cur));
    b.onclick=()=>{set(v);home()};
    el.appendChild(b);
  });
}
function filtered(){return QUESTIONS.filter(q=>(!selSkill||q.skill===selSkill)&&(!selLevel||q.level===selLevel))}
function home(){
  const skills=[...new Set(QUESTIONS.map(q=>q.skill))];
  const lv=LEVELS.filter(l=>QUESTIONS.some(q=>q.level===l));
  chips($('fSkill'),[['','Toutes'],...skills.map(s=>[s,SKILLS[s]||s])],selSkill,v=>selSkill=v);
  chips($('fLevel'),[['','Tous'],...lv.map(l=>[l,l])],selLevel,v=>selLevel=v);
  const n=filtered().length;
  $('count').textContent=n?`${n} question${n>1?'s':''} prête${n>1?'s':''}`:'Aucune question pour ce choix.';
  const b=store('quiz-best');
  $('best').textContent=b?`Meilleur score : ${b}`:'';
  screen('start');
  dock(`<button class="btn" id="go" ${n?'':'disabled'}>Commencer</button>`);
  $('go').onclick=()=>start(filtered());
}

/* ----- jeu ----- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){pool=shuffle(list);idx=0;answers=[];screen('quiz');render()}
function render(){
  const q=pool[idx];locked=false;
  $('prog').style.width=(idx/pool.length*100)+'%';
  $('pos').textContent=`${idx+1} / ${pool.length}`;
  $('tags').innerHTML=`<span class="tag">${esc(SKILLS[q.skill]||q.skill)}</span><span class="tag">${esc(q.level)}</span>`;
  $('ctx').hidden=!q.ctx;$('ctx').textContent=q.ctx||'';
  $('stem').textContent=q.stem;
  $('expl').hidden=true;
  $('choices').innerHTML='';
  q.choices.forEach((c,i)=>{
    const b=document.createElement('button');b.className='choice';
    b.innerHTML=`<b>${'ABCD'[i]}</b><span></span>`;b.lastChild.textContent=c;
    b.onclick=()=>pick(i);$('choices').appendChild(b);
  });
  dock(`<button class="btn" disabled>Choisis une réponse</button>`);
}
function pick(i){
  if(locked)return;locked=true;
  const q=pool[idx],good=i===q.answer;
  answers.push({q,good});
  [...$('choices').children].forEach((b,k)=>{
    b.disabled=true;
    if(k===q.answer)b.classList.add('ok');else if(k===i)b.classList.add('ko');
  });
  const e=$('expl');
  e.innerHTML=`<strong class="${good?'ok':'ko'}">${good?'Bonne réponse !':'Pas tout à fait.'}</strong>`;
  e.appendChild(document.createTextNode(q.expl||''));
  e.hidden=false;
  e.scrollIntoView({behavior:'smooth',block:'nearest'});
  const last=idx===pool.length-1;
  dock(`<button class="btn" id="nx">${last?'Voir le résultat':'Question suivante'}</button>`);
  $('nx').onclick=()=>last?finish():(idx++,render(),window.scrollTo(0,0));
}
function finish(){
  const ok=answers.filter(a=>a.good).length,n=answers.length,p=ok/n;
  $('prog').style.width='100%';
  $('score').textContent=`${ok}/${n}`;
  $('pct').textContent=`${Math.round(p*100)} % de réussite`;
  $('msg').textContent=p===1?'Parfait !':p>=.7?'Très bien !':p>=.5?'Pas mal, continue !':'Courage, réessaie.';
  const prev=store('quiz-best-pct');
  if(n>=3&&(prev===null||p>parseFloat(prev))){store('quiz-best-pct',String(p));store('quiz-best',`${ok}/${n}`)}
  const wrong=answers.filter(a=>!a.good);
  $('review').innerHTML=wrong.map(a=>`<li>${esc(a.q.stem)}<small>Réponse : ${esc(a.q.choices[a.q.answer])}</small></li>`).join('');
  screen('end');
  dock(`${wrong.length?'<button class="btn ghost" id="rw">Refaire les erreurs</button>':''}<button class="btn" id="again">Accueil</button>`);
  if(wrong.length)$('rw').onclick=()=>start(wrong.map(a=>a.q));
  $('again').onclick=home;
}
$('quit').onclick=home;
home();
</script>

</body></html>
